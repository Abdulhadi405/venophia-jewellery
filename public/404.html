<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Venophia</title>
    <script>
      const path = window.location.pathname
      const base = document.querySelector('base')?.href || '/'
      const redirect = base + '?redirect=' + encodeURIComponent(path + window.location.search + window.location.hash)
      window.location.replace(redirect)
    </script>
  </head>
  <body></body>
</html>
